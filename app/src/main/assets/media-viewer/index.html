<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Framatome VR immersive media viewer" />
  <title>Framatome VR</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- 2D launch chrome / flat preview. Hidden once an immersive session starts. -->
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">F</span>
        <span class="brand-text">
          <span class="brand-mark">FRAMATOME</span>
          <span class="brand-sub">VR</span>
        </span>
      </div>
      <span id="badge" class="badge" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="badgeText">Media</span>
      </span>
    </header>

    <main class="stage-wrap">
      <h1 id="title">Media</h1>
      <div id="stage">
        <div id="preview"></div>

        <div id="loader">
          <div class="spinner" aria-hidden="true"></div>
          <p id="loaderLabel" class="loader-label" role="status" aria-live="polite">Loading media&hellip;</p>
        </div>

        <div id="errorCard" role="alert">
          <span class="error-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </span>
          <h2 class="error-title">Unable to load media</h2>
          <p id="errorMessage" class="error-message"></p>
          <p id="errorFile" class="error-file"></p>
          <div class="error-actions">
            <button id="retry" class="btn-ghost" type="button">Try again</button>
            <button id="errorExitHub" class="btn-primary" type="button">Exit to hub</button>
          </div>
        </div>
      </div>

      <!-- Flat video transport. Hidden for images and during VR. -->
      <div id="controls" hidden>
        <button id="playToggle" class="btn-icon" type="button" aria-label="Play or pause">
          <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <span id="curTime" class="time">0:00</span>
        <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <span id="durTime" class="time">0:00</span>
        <button id="mute" class="btn-icon" type="button" aria-label="Mute or unmute">
          <svg class="icon-sound" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>
          <svg class="icon-muted" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8l5 8M21 8l-5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="actions">
        <button id="enterVr" class="btn-primary" type="button" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 6H3a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4.3a2 2 0 0 0 1.7-1l1.2-1.8a1 1 0 0 1 1.6 0L13.7 16a2 2 0 0 0 1.7 1H21a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/>
          </svg>
          <span>Enter VR</span>
        </button>
        <button id="exitHub" class="btn-ghost" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>
          </svg>
          <span>Exit to hub</span>
        </button>
      </div>
      <p id="status" role="status" aria-live="polite">Preparing immersive view&hellip;</p>
      <span id="vrHint" class="vr-hint" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span id="vrHintText"></span>
      </span>
    </footer>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
