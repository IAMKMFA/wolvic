pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    // PREFER_SETTINGS makes these authoritative and ignores per-project repositories,
    // so every repo the build needs must be declared here — including the local
    // WebXR-patched GeckoView repo. Configure its location with -PgeckoMavenRepo=…
    // or geckoMavenRepo=… in gradle.properties; defaults to <root>/gecko-maven.
    def geckoMavenRepo = providers.gradleProperty('geckoMavenRepo').getOrElse("${settingsDir}/gecko-maven")
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name "LocalGeckoView"
                    url geckoMavenRepo
                }
            }
            filter {
                includeGroup "org.mozilla.geckoview"
            }
        }
        google()
        mavenCentral()
        maven { url 'https://maven.mozilla.org/maven2' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://storage.googleapis.com/r8-releases/raw' }
    }
}

def repoRoot = settingsDir.parentFile

include ':app'

['content-contract', 'content-ingest', 'core-ui', 'tour-injection',
 'feature-native-image360', 'feature-native-image2d',
 'feature-native-video360', 'feature-flat-video'].each { name ->
    include ":$name"
    project(":$name").projectDir = new File(repoRoot, name)
}

Properties userProperties = null;
if (file('user.properties').canRead()) {
    userProperties = new Properties()
    userProperties.load(file('user.properties').newDataInputStream())
    logger.lifecycle('Local configuration: loaded user.properties')
} else {
    logger.lifecycle('Local configuration: absent user.properties; proceeding as normal.')
}

if (userProperties != null) {
    userProperties.each { prop ->
        gradle.ext.set("userProperties.${prop.key}", prop.value)
        logger.lifecycle("\tuserProperties.${prop.key}" + '=' + prop.value)
    }
    if (gradle.hasProperty('userProperties.enableServo')) {
        logger.lifecycle('Including Servo.')
        include ':servo'
    }
}

Properties localProperties = null;
if (file('local.properties').canRead()) {
    localProperties = new Properties()
    localProperties.load(file('local.properties').newDataInputStream())
    logger.lifecycle('Local configuration: loaded local.properties')
} else {
    logger.lifecycle('Local configuration: absent local.properties; proceeding as normal.')
}

if (localProperties != null) {
    localProperties.each { prop ->
        gradle.ext.set("localProperties.${prop.key}", prop.value)
        logger.lifecycle("\tlocalProperties.${prop.key}" + '=' + prop.value)
    }
}
