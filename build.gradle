// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    dependencies {
        classpath libs.agp
        classpath libs.kotlin.plugin
        classpath libs.huawei.agconnect.agcp
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

allprojects {
    repositories {
        // WebXR-patched GeckoView (geckoview-default:…-SNAPSHOT) is consumed from a
        // local Maven repository — the `…/gradle/maven` directory produced by
        // build-gecko-webxr.sh. Configure the location without editing this file:
        //   • -PgeckoMavenRepo=/abs/path/to/gradle/maven   (CLI), or
        //   • geckoMavenRepo=/abs/path/to/gradle/maven      (gradle.properties)
        // Defaults to <root>/gecko-maven so the artifact can simply be dropped in.
        def geckoMavenRepo = project.findProperty('geckoMavenRepo') ?: "${rootDir}/gecko-maven"
        maven {
            name "LocalGeckoView"
            url geckoMavenRepo
        }
        google()
        maven { url 'https://maven.mozilla.org/maven2' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://storage.googleapis.com/r8-releases/raw' }
    }
}

tasks.register("clean", Delete) {
    delete layout.buildDirectory
}
